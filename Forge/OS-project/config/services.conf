# Task Killers - Linux Service Supervisor
# command, workdir, depends_on, autorestart, max_restarts, delay,
# backoff, stop_timeout, start_secs, nice, heartbeat, heartbeat_timeout

[heartbeat]
command=./bin/dummy_worker heartbeat 2
autorestart=yes
max_restarts=10
delay=1
backoff=yes
heartbeat=yes
heartbeat_timeout=6
stop_timeout=3
start_secs=2
nice=5

[logger]
command=./bin/dummy_worker logger 3
depends_on=heartbeat
autorestart=yes
max_restarts=10
delay=1
backoff=yes
heartbeat=yes
heartbeat_timeout=8
stop_timeout=3
start_secs=2

[metrics]
command=./bin/dummy_worker metrics 2
depends_on=heartbeat
autorestart=yes
max_restarts=10
delay=1
backoff=yes
heartbeat=yes
heartbeat_timeout=8
stop_timeout=3
start_secs=2

[audit]
command=./bin/dummy_worker audit 4
depends_on=logger
autorestart=yes
max_restarts=10
delay=1
backoff=yes
heartbeat=yes
heartbeat_timeout=10
stop_timeout=3
start_secs=2

[flaky]
command=./bin/flaky_worker
autorestart=yes
max_restarts=10
delay=1
backoff=yes
heartbeat=yes
heartbeat_timeout=8
stop_timeout=3
start_secs=2

[hung]
command=./bin/hung_worker
autorestart=yes
max_restarts=10
delay=1
backoff=yes
heartbeat=yes
heartbeat_timeout=8
stop_timeout=3
start_secs=2
